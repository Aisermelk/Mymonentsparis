<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Oportunidade Moments Paris | Comece sua jornada</title>

  <meta
    name="description"
    content="Conheça a oportunidade Moments Paris, escolha como começar e desenvolva suas vendas no seu ritmo."
  >

  <meta
    name="theme-color"
    content="#080808"
  >

  <meta
    property="og:title"
    content="Comece sua jornada com a Moments Paris"
  >

  <meta
    property="og:description"
    content="Conheça os produtos, escolha como começar e desenvolva suas vendas no seu ritmo."
  >

  <meta
    property="og:image"
    content="../assets/images/divulgação.jpg"
  >

  <meta
    property="og:type"
    content="website"
  >

  <link
    rel="icon"
    type="image/png"
    href="../assets/images/logo.png"
  >

  <style>
    :root {
      --black: #070707;
      --black-soft: #0d0d0d;
      --black-card: #111111;
      --black-light: #171717;

      --gold: #c7a35b;
      --gold-light: #e4c982;
      --gold-soft: rgba(199, 163, 91, .18);

      --white: #ffffff;
      --text: #eeeeee;
      --muted: #a6a6a6;

      --border: rgba(199, 163, 91, .25);

      --container: 1180px;
      --radius: 4px;

      --shadow:
        0 20px 60px rgba(0, 0, 0, .45);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background: var(--black);
      color: var(--text);
      line-height: 1.6;
      overflow-x: hidden;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .luxury-container {
      width: min(
        calc(100% - 40px),
        var(--container)
      );

      margin: 0 auto;
    }

    /* =========================================
       HEADER
    ========================================= */

    .luxury-header {
      position: sticky;
      top: 0;
      z-index: 1000;

      background:
        rgba(7, 7, 7, .96);

      border-bottom:
        1px solid rgba(199, 163, 91, .12);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .luxury-header-inner {
      min-height: 78px;

      display: grid;

      grid-template-columns:
        1fr
        auto
        1fr;

      align-items: center;

      gap: 30px;
    }

    .luxury-brand {
      justify-self: start;

      display: inline-flex;
      align-items: center;
      gap: 12px;

      white-space: nowrap;
    }

    .luxury-brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    .luxury-brand span {
      color: var(--gold-light);

      font-size: 13px;
      font-weight: 700;

      letter-spacing: 2px;
    }

    .luxury-nav {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 28px;

      white-space: nowrap;
    }

    .luxury-nav a {
      position: relative;

      color: #d5d5d5;

      font-size: 12px;
      font-weight: 500;

      letter-spacing: .8px;

      transition: .25s ease;
    }

    .luxury-nav a::after {
      content: "";

      position: absolute;

      left: 0;
      bottom: -7px;

      width: 0;
      height: 1px;

      background: var(--gold);

      transition: .25s ease;
    }

    .luxury-nav a:hover {
      color: var(--gold-light);
    }

    .luxury-nav a:hover::after {
      width: 100%;
    }

    .luxury-header-whatsapp {
      justify-self: end;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      border:
        1px solid var(--border);

      padding:
        10px 18px;

      color:
        var(--gold-light) !important;

      border-radius: 3px;

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 1px;

      white-space: nowrap;

      transition: .25s ease;
    }

    .luxury-header-whatsapp:hover {
      background: var(--gold);
      color: #080808 !important;
      border-color: var(--gold);
    }

    /* =========================================
       HERO
    ========================================= */

    .luxury-hero {
      position: relative;

      min-height:
        calc(100vh - 78px);

      display: flex;
      align-items: center;

      padding:
        100px 0;

      background:
        radial-gradient(
          circle at 80% 20%,
          rgba(199, 163, 91, .12),
          transparent 35%
        ),

        radial-gradient(
          circle at 15% 80%,
          rgba(255, 255, 255, .03),
          transparent 30%
        ),

        linear-gradient(
          135deg,
          #080808 0%,
          #101010 50%,
          #070707 100%
        );

      overflow: hidden;
    }

    .luxury-hero::before {
      content: "";

      position: absolute;

      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, .45),
          transparent 60%
        );

      pointer-events: none;
    }

    .luxury-hero-content {
      position: relative;
      z-index: 2;

      max-width: 760px;
    }

    .luxury-eyebrow {
      display: inline-block;

      margin-bottom: 22px;

      color: var(--gold-light);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .luxury-hero h1 {
      max-width: 800px;

      margin-bottom: 25px;

      color: var(--white);

      font-size:
        clamp(42px, 6vw, 76px);

      line-height: 1.04;

      font-weight: 700;

      letter-spacing: -2px;
    }

    .luxury-hero h1 span {
      color: var(--gold-light);
    }

    .luxury-hero p {
      max-width: 650px;

      margin-bottom: 35px;

      color: var(--muted);

      font-size: 18px;

      line-height: 1.8;
    }

    /* =========================================
       BUTTONS
    ========================================= */

    .luxury-button {
      display: inline-flex;

      align-items: center;
      justify-content: center;

      min-height: 50px;

      padding:
        0 27px;

      border:
        1px solid var(--gold);

      border-radius: 3px;

      background:
        linear-gradient(
          135deg,
          var(--gold-light),
          var(--gold)
        );

      color: #080808;

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 1.3px;

      text-transform: uppercase;

      cursor: pointer;

      transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
    }

    .luxury-button:hover {
      transform: translateY(-2px);

      box-shadow:
        0 12px 30px rgba(199, 163, 91, .22);
    }

    .luxury-button-outline {
      background: transparent;
      color: var(--gold-light);
    }

    .luxury-button-outline:hover {
      background: var(--gold);
      color: #080808;
    }

    /* =========================================
       SECTIONS
    ========================================= */

    .luxury-section {
      padding:
        100px 0;
    }

    .luxury-section-dark {
      background:
        var(--black-soft);
    }

    .luxury-section-title {
      max-width: 750px;

      margin:
        0 auto 55px;

      text-align: center;
    }

    .luxury-section-label {
      display: block;

      margin-bottom: 14px;

      color: var(--gold-light);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 3px;

      text-transform: uppercase;
    }

    .luxury-section-title h2 {
      margin-bottom: 17px;

      color: var(--white);

      font-size:
        clamp(32px, 4vw, 50px);

      line-height: 1.1;

      letter-spacing: -1px;
    }

    .luxury-section-title p {
      color: var(--muted);

      font-size: 16px;
    }

    /* =========================================
       OPPORTUNITY
    ========================================= */

    .luxury-opportunity-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 22px;
    }

    .luxury-card {
      position: relative;

      padding: 36px 30px;

      background:
        linear-gradient(
          145deg,
          #121212,
          #0d0d0d
        );

      border:
        1px solid rgba(199, 163, 91, .16);

      border-radius: var(--radius);

      box-shadow: var(--shadow);

      transition:
        transform .3s ease,
        border-color .3s ease;
    }

    .luxury-card:hover {
      transform: translateY(-7px);

      border-color:
        rgba(199, 163, 91, .48);
    }

    .luxury-card-number {
      margin-bottom: 22px;

      color: var(--gold);

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 2px;
    }

    .luxury-card h3 {
      margin-bottom: 14px;

      color: var(--white);

      font-size: 21px;
    }

    .luxury-card p {
      color: var(--muted);

      font-size: 15px;

      line-height: 1.7;
    }

    /* =========================================
       KITS
    ========================================= */

    .luxury-kits-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 24px;
    }

    .luxury-kit {
      position: relative;

      padding: 40px 32px;

      background:
        linear-gradient(
          145deg,
          #141414,
          #0c0c0c
        );

      border:
        1px solid rgba(199, 163, 91, .18);

      border-radius: 4px;

      text-align: center;

      overflow: hidden;

      transition:
        transform .3s ease,
        border-color .3s ease;
    }

    .luxury-kit::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;
      right: 0;

      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--gold),
          transparent
        );
    }

    .luxury-kit:hover {
      transform: translateY(-8px);

      border-color:
        rgba(199, 163, 91, .45);
    }

    .luxury-kit-label {
      display: block;

      margin-bottom: 13px;

      color: var(--gold-light);

      font-size: 11px;
      font-weight: 700;

      letter-spacing: 2px;

      text-transform: uppercase;
    }

    .luxury-kit h3 {
      margin-bottom: 18px;

      color: var(--white);

      font-size: 25px;
    }

    .luxury-kit-price {
      margin-bottom: 28px;

      color: var(--gold-light);

      font-size: 38px;
      font-weight: 800;

      line-height: 1;
    }

    .luxury-kit-price small {
      font-size: 15px;
      font-weight: 500;
    }

    .luxury-kit-description {
      min-height: 70px;

      margin-bottom: 28px;

      color: var(--muted);

      font-size: 14px;
    }

    .luxury-kit-link {
      display: inline-block;

      color: var(--gold-light);

      font-size: 12px;
      font-weight: 800;

      letter-spacing: 1.3px;

      text-transform: uppercase;
    }

    .luxury-kit-link:hover {
      color: var(--white);
    }

    /* WHATSAPP ABAIXO DOS KITS */

    .luxury-kits-whatsapp {
      display: flex;

      justify-content: center;
      align-items: center;

      margin-top: 45px;

      text-align: center;
    }

    /* =========================================
       COMO FUNCIONA
    ========================================= */

    .luxury-steps {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 25px;

      counter-reset: steps;
    }

    .luxury-step {
      position: relative;

      padding: 32px;

      border-top:
        1px solid var(--border);
    }

    .luxury-step-number {
      margin-bottom: 20px;

      color: var(--gold);

      font-size: 38px;
      font-weight: 800;

      line-height: 1;
    }

    .luxury-step h3 {
      margin-bottom: 12px;

      color: var(--white);

      font-size: 20px;
    }

    .luxury-step p {
      color: var(--muted);

      font-size: 14px;
    }

    /* =========================================
       CARREIRA
    ========================================= */

    .luxury-career-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }

    .luxury-career-card {
      padding: 25px 20px;

      background:
        #101010;

      border:
        1px solid rgba(199, 163, 91, .15);

      text-align: center;

      border-radius: 3px;

      transition: .25s ease;
    }

    .luxury-career-card:hover {
      border-color:
        rgba(199, 163, 91, .45);

      transform: translateY(-4px);
    }

    .luxury-career-card strong {
      display: block;

      margin-bottom: 7px;

      color: var(--gold-light);

      font-size: 18px;
    }

    .luxury-career-card span {
      color: var(--muted);

      font-size: 12px;

      letter-spacing: .5px;
    }

    /* =========================================
       FORMULÁRIO
    ========================================= */

    .luxury-form-wrapper {
      max-width: 780px;

      margin: 0 auto;

      padding: 42px;

      background:
        linear-gradient(
          145deg,
          #141414,
          #0b0b0b
        );

      border:
        1px solid var(--border);

      border-radius: 4px;

      box-shadow: var(--shadow);
    }

    .luxury-form {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }

    .luxury-field {
      display: flex;

      flex-direction: column;

      gap: 8px;
    }

    .luxury-field-full {
      grid-column: 1 / -1;
    }

    .luxury-field label {
      color: #d7d7d7;

      font-size: 12px;
      font-weight: 600;

      letter-spacing: .5px;
    }

    .luxury-field input,
    .luxury-field select,
    .luxury-field textarea {
      width: 100%;

      min-height: 48px;

      padding:
        12px 14px;

      border:
        1px solid rgba(255, 255, 255, .1);

      border-radius: 3px;

      outline: none;

      background:
        #090909;

      color: var(--white);

      transition:
        border-color .2s ease;
    }

    .luxury-field textarea {
      min-height: 110px;

      resize: vertical;
    }

    .luxury-field input:focus,
    .luxury-field select:focus,
    .luxury-field textarea:focus {
      border-color:
        var(--gold);
    }

    .luxury-field input::placeholder,
    .luxury-field textarea::placeholder {
      color: #666;
    }

    .luxury-checkbox {
      grid-column: 1 / -1;

      display: flex;

      align-items: flex-start;

      gap: 10px;

      color: #999;

      font-size: 12px;
    }

    .luxury-checkbox input {
      width: 16px;
      height: 16px;

      margin-top: 2px;

      accent-color: var(--gold);
    }

    .luxury-form-button {
      grid-column: 1 / -1;

      width: 100%;
    }

    /* =========================================
       CADASTRO
    ========================================= */

    .luxury-register-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 20px;
    }

    .luxury-register-card {
      padding: 32px;

      background:
        #101010;

      border:
        1px solid var(--border);

      border-radius: 3px;

      text-align: center;
    }

    .luxury-register-card h3 {
      margin-bottom: 12px;

      color: var(--white);

      font-size: 20px;
    }

    .luxury-register-card p {
      margin-bottom: 22px;

      color: var(--muted);

      font-size: 14px;
    }

    /* =========================================
       FAQ
    ========================================= */

    .luxury-faq {
      max-width: 850px;

      margin: 0 auto;
    }

    .luxury-faq details {
      border-bottom:
        1px solid rgba(199, 163, 91, .16);

      padding: 22px 0;
    }

    .luxury-faq summary {
      cursor: pointer;

      color: var(--white);

      font-size: 16px;
      font-weight: 600;

      list-style: none;
    }

    .luxury-faq summary::-webkit-details-marker {
      display: none;
    }

    .luxury-faq summary::after {
      content: "+";

      float: right;

      color: var(--gold-light);

      font-size: 22px;

      font-weight: 300;
    }

    .luxury-faq details[open] summary::after {
      content: "−";
    }

    .luxury-faq p {
      max-width: 760px;

      padding-top: 14px;

      color: var(--muted);

      font-size: 14px;

      line-height: 1.7;
    }

    /* =========================================
       CTA FINAL
    ========================================= */

    .luxury-final-cta {
      padding:
        110px 0;

      text-align: center;

      background:
        radial-gradient(
          circle at center,
          rgba(199, 163, 91, .13),
          transparent 45%
